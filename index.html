<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policies - Yellon Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fafafa;
            --text-color: #1a1a1a;
            --text-muted: #666666;
            --border-color: #eaeaea;
            --container-bg: #ffffff;
            --btn-bg: #1a1a1a;
            --btn-text: #ffffff;
            --btn-hover-bg: #333333;
            --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0a0a0a;
                --text-color: #ededed;
                --text-muted: #a0a0a0;
                --border-color: #222222;
                --container-bg: #121212;
                --btn-bg: #ffffff;
                --btn-text: #0a0a0a;
                --btn-hover-bg: #e0e0e0;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            color: var(--text-color);
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
        }

        .portal-card {
            width: 100%;
            max-width: 480px;
            background: var(--container-bg);
            padding: 4rem 3rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.015);
            text-align: center;
        }

        .logo {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 0.75rem;
            color: var(--text-color);
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 3rem;
            line-height: 1.5;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.75rem;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--btn-text);
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn:hover {
            background-color: var(--btn-hover-bg);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-arrow {
            font-size: 1.2rem;
            transition: transform 0.2s ease;
        }

        .btn:hover .btn-arrow {
            transform: translateX(4px);
        }

        footer {
            margin-top: 3.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="portal-card">
    <div class="logo">Yellon</div>
    <p class="subtitle">Select a game below to view its Privacy Policy.</p>
    
    <div class="buttons-container">
        <a href="sudokumadness.html" class="btn">
            <span>Sudoku Madness</span>
            <span class="btn-arrow">&rarr;</span>
        </a>
        <a href="arrowsmadness.html" class="btn">
            <span>Arrows Madness</span>
            <span class="btn-arrow">&rarr;</span>
        </a>
    </div>

    <footer>
        &copy; 2026 Yellon Games. All rights reserved.
    </footer>
</div>

</body>
</html>
